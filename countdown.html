<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#faf6f0" />
<title>倒计时 · 2027.02.15</title>

<!-- PWA：让 Safari「添加到 Dock」后成为独立 App -->
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="倒计时" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="description" content="从今天到 2027 年 2 月 15 日的治愈系倒计时" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          cream:   '#faf6f0',
          sand:    '#e8dfd1',
          cocoa:   '#a89684',
          mauve:   '#c9b2a6',
          blush:   '#e6c8be',
          ink:     '#4a4036',
          softink: '#7a6f63'
        },
        fontFamily: {
          sans:   ['"PingFang SC"', '"Hiragino Sans GB"', '"Microsoft YaHei"', 'system-ui', 'sans-serif'],
          number: ['"SF Pro Display"', '"Helvetica Neue"', 'system-ui', 'sans-serif']
        },
        boxShadow: {
          soft: '0 8px 30px -12px rgba(168, 150, 132, 0.25)'
        }
      }
    }
  }
</script>
<style>
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 600px at 50% -200px, #f6ede1 0%, transparent 60%),
      radial-gradient(800px 600px at 90% 110%, #f0e2d3 0%, transparent 60%),
      #faf6f0;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  .digit {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    letter-spacing: -0.02em;
  }
  .pulse-dot {
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(0.95); }
    50%      { opacity: 1;   transform: scale(1.05); }
  }
  .breath {
    animation: breath 6s ease-in-out infinite;
  }
  @keyframes breath {
    0%, 100% { transform: translateY(0px); }
    50%      { transform: translateY(-6px); }
  }
  .ring-track {
    background: conic-gradient(#c9b2a6 var(--p, 0%), rgba(168, 150, 132, 0.12) 0%);
  }
  /* 数字翻转时的平滑过渡 */
  .tick { transition: transform .25s cubic-bezier(.2,.7,.2,1); }
  /* 移动端微调 */
  @media (max-width: 380px) {
    .num { font-size: 2.75rem; line-height: 1; }
  }
</style>
</head>
<body class="font-sans text-ink min-h-screen flex items-center justify-center px-5 py-10">

<main class="w-full max-w-md mx-auto">

  <!-- 顶部呼吸小圆点 + 文案 -->
  <header class="flex flex-col items-center text-center mb-10 breath">
    <div class="w-2 h-2 rounded-full bg-mauve pulse-dot mb-5"></div>
    <p class="text-xs tracking-[0.35em] text-softink uppercase">counting down</p>
    <h1 class="mt-3 text-2xl font-medium text-ink">距离那一天</h1>
    <p class="mt-1 text-sm text-softink">还有一点点时间，慢慢靠近</p>
  </header>

  <!-- 倒计时主卡片 -->
  <section class="bg-white/70 backdrop-blur-sm rounded-[28px] shadow-soft border border-sand/60 px-6 py-8">

    <!-- 大数字 -->
    <div class="grid grid-cols-4 gap-3 text-center">
      <!-- 天 -->
      <div class="flex flex-col items-center">
        <div class="w-full bg-cream rounded-2xl py-5 border border-sand/70">
          <div id="d" class="num digit text-5xl font-medium text-ink">--</div>
        </div>
        <div class="text-[11px] tracking-[0.3em] text-softink mt-2">天</div>
      </div>
      <!-- 时 -->
      <div class="flex flex-col items-center">
        <div class="w-full bg-cream rounded-2xl py-5 border border-sand/70">
          <div id="h" class="num digit text-5xl font-medium text-ink">--</div>
        </div>
        <div class="text-[11px] tracking-[0.3em] text-softink mt-2">时</div>
      </div>
      <!-- 分 -->
      <div class="flex flex-col items-center">
        <div class="w-full bg-cream rounded-2xl py-5 border border-sand/70">
          <div id="m" class="num digit text-5xl font-medium text-ink">--</div>
        </div>
        <div class="text-[11px] tracking-[0.3em] text-softink mt-2">分</div>
      </div>
      <!-- 秒 -->
      <div class="flex flex-col items-center">
        <div class="w-full bg-blush/40 rounded-2xl py-5 border border-blush/70">
          <div id="s" class="num digit text-5xl font-medium text-cocoa">--</div>
        </div>
        <div class="text-[11px] tracking-[0.3em] text-cocoa/80 mt-2">秒</div>
      </div>
    </div>

    <!-- 进度条 -->
    <div class="mt-8">
      <div class="flex justify-between text-[11px] text-softink mb-2">
        <span>2026·10·08</span>
        <span id="pct" class="digit">0%</span>
        <span>2027·02·15</span>
      </div>
      <div class="relative h-1.5 w-full bg-sand/60 rounded-full overflow-visible">
        <div id="bar" class="absolute left-0 top-0 h-full bg-gradient-to-r from-mauve to-blush rounded-full transition-[width] duration-700 ease-out" style="width: 0%"></div>
        <!-- 4 个里程碑小点 -->
        <div class="absolute inset-0 pointer-events-none">
          <div class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 left-0   w-1.5 h-1.5 rounded-full bg-sand"></div>
          <div class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 left-[25%]  w-1.5 h-1.5 rounded-full bg-sand"></div>
          <div class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 left-[50%]  w-1.5 h-1.5 rounded-full bg-sand"></div>
          <div class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 left-[75%]  w-1.5 h-1.5 rounded-full bg-sand"></div>
          <div class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 left-full w-1.5 h-1.5 rounded-full bg-sand"></div>
        </div>
      </div>
      <p id="progress-label" class="text-center text-xs text-softink mt-3">已经走了一小段路</p>
      <!-- 双面进度：已走过 vs 还剩 -->
      <div id="dual" class="mt-3 flex justify-center items-center gap-3 text-[11px] text-softink">
        <span><span class="digit text-ink/80" id="gone-days">--</span> 天已经走过</span>
        <span class="w-px h-3 bg-sand"></span>
        <span><span class="digit text-cocoa" id="left-days">--</span> 天还在等</span>
      </div>
    </div>
  </section>

  <!-- 今日小卡：让 129 天每天打开都有一点不一样 -->
  <section class="mt-6 bg-white/60 backdrop-blur-sm rounded-[24px] border border-sand/60 px-6 py-5">
    <div class="flex items-center justify-between">
      <p class="text-[10px] tracking-[0.3em] text-softink uppercase">today</p>
      <p id="today-date" class="text-[11px] text-softink digit">--</p>
    </div>
    <p id="today-quote" class="mt-3 text-[15px] leading-relaxed text-ink">—</p>
    <div class="mt-4 pt-4 border-t border-dashed border-sand/80">
      <p class="text-[10px] tracking-[0.3em] text-cocoa/80 uppercase">little thing</p>
      <p id="today-task" class="mt-1 text-[13px] text-softink">—</p>
    </div>
  </section>

  <!-- 目标日期说明卡片 -->
  <section class="mt-6 bg-white/50 backdrop-blur-sm rounded-[24px] border border-sand/60 px-6 py-5 text-center">
    <p class="text-xs text-softink tracking-widest">TARGET</p>
    <p class="mt-1 text-lg text-ink font-medium digit">2027 · 02 · 15</p>
    <p class="mt-1 text-xs text-softink">星期一 · 农历正月十五前后</p>
  </section>

  <!-- 底部小字 -->
  <footer class="text-center mt-8">
    <p class="text-[11px] text-softink/70 tracking-widest">每一秒都在靠近</p>
    <p id="live" class="digit text-[10px] text-softink/50 mt-1">--</p>
  </footer>
</main>

<script>
(() => {
  const TARGET = new Date('2027-02-15T00:00:00+08:00').getTime();
  // 把"今天零点"作为起点，让进度条感觉更自然
  const START  = new Date('2026-10-08T00:00:00+08:00').getTime();

  const $d  = document.getElementById('d');
  const $h  = document.getElementById('h');
  const $m  = document.getElementById('m');
  const $s  = document.getElementById('s');
  const $bar = document.getElementById('bar');
  const $pct = document.getElementById('pct');
  const $live = document.getElementById('live');
  const $progressLabel = document.getElementById('progress-label');
  const $goneDays  = document.getElementById('gone-days');
  const $leftDays  = document.getElementById('left-days');
  const $todayDate = document.getElementById('today-date');
  const $todayQuote= document.getElementById('today-quote');
  const $todayTask = document.getElementById('today-task');

  const pad = n => String(Math.max(0, n)).padStart(2, '0');

  // 阶段文案
  const labels = {
    early: '刚刚开始，别急',
    small: '已经走了一小段路',
    half:  '走过一半了，继续',
    near:  '马上就要到了',
    done:  '今天就是那一天 ✿'
  };

  // 暖心话语 30 句
  const QUOTES = [
    '今天也是被温柔对待的一天。',
    '慢一点，没关系。',
    '在等待里，你也在变成自己。',
    '不必每一天都拼尽全力。',
    '允许自己今天就只是这样。',
    '你已经很努力地在往前走了。',
    '想休息的时候，就真的休息。',
    '明天的太阳照样会升起来。',
    '此刻的呼吸，就是你的节奏。',
    '拥抱自己一下，像抱一个朋友。',
    '如果今天有点糟，那就有点糟吧。',
    '日子过一天，就少一天等待。',
    '到了那天，回头看会觉得很快的。',
    '一杯热茶，可以慢一点喝完。',
    '不必为还没发生的事担心。',
    '你看，今天的天空也很温柔。',
    '一切都是过程，包括等待。',
    '你值得被这段时间好好对待。',
    '每天醒来，又近了一天。',
    '心里难过的话，就难过一会儿吧。',
    '你比自己想象中更稳。',
    '在忙，也别忘了吃东西。',
    '今天已经赢了昨天的自己。',
    '让风替你说一声辛苦了。',
    '慢慢地、稳稳地，就是最好。',
    '把今天过成自己喜欢的样子。',
    '一切都会来的，按它的节奏。',
    '今天也是个好日子，就因为有你在。',
    '你一直在认真地走这条路。',
    '黑夜里也有人在等同一束光。',
  ];

  // 不打卡的小任务 15 个
  const TASKS = [
    '深呼吸 3 次，慢慢吐气。',
    '给一个你想念的人发条消息。',
    '看窗外 5 分钟，看什么都行。',
    '喝一杯温水，感受它的温度。',
    '把肩膀放松下来，转转脖子。',
    '听一首你最熟悉的歌。',
    '对镜子里的自己笑一下。',
    '写下今天 1 件还不错的小事。',
    '找一处光，晒一下自己的脸。',
    '把身边收拾整齐一角就好。',
    '闭上眼睛，数 60 下。',
    '起床后先站一会儿，别急。',
    '把手机放下 30 分钟。',
    '摸摸自己的手背，告诉它辛苦了。',
    '起身倒一杯水，不需要喝也行。',
  ];

  // 用日期 hash 当日稳定选题（每天同样的，打开几次都是同一句）
  function daySeed() {
    const now = new Date();
    return Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
  }
  function pick(arr) { return arr[daySeed() % arr.length]; }
  function pickIdx(i) { return arr => arr[(daySeed() + i) % arr.length]; }

  // 渲染今日卡（一次性）
  function paintToday() {
    const now = new Date();
    const wk = ['日','一','二','三','四','五','六'][now.getDay()];
    $todayDate.textContent = `${now.getMonth()+1}月${now.getDate()}日 · 周${wk}`;
    $todayQuote.textContent = '「' + pick(QUOTES) + '」';
    $todayTask.textContent  = pickIdx(7)(TASKS);
  }

  function paint() {
    const now = Date.now();
    let diff = TARGET - now;

    if (diff <= 0) {
      $d.textContent = '00'; $h.textContent = '00';
      $m.textContent = '00'; $s.textContent = '00';
      $bar.style.width = '100%';
      $pct.textContent = '100%';
      $progressLabel.textContent = labels.done;
      $live.textContent = '已抵达';
      return;
    }

    const day  = Math.floor(diff / 86400000); diff -= day * 86400000;
    const hour = Math.floor(diff / 3600000);  diff -= hour * 3600000;
    const min  = Math.floor(diff / 60000);    diff -= min * 60000;
    const sec  = Math.floor(diff / 1000);

    $d.textContent = pad(day);
    $h.textContent = pad(hour);
    $m.textContent = pad(min);
    $s.textContent = pad(sec);

    // 进度
    const total = TARGET - START;
    const passed = now - START;
    const pct = Math.min(100, Math.max(0, (passed / total) * 100));
    $bar.style.width = pct.toFixed(2) + '%';
    $pct.textContent = pct.toFixed(1) + '%';

    // 双面进度
    const msPerDay = 86400000;
    const totalDays = Math.floor(total / msPerDay);
    const goneDays  = Math.min(totalDays, Math.max(0, Math.floor(passed / msPerDay)));
    const leftDays  = Math.max(0, totalDays - goneDays);
    $goneDays.textContent = goneDays;
    $leftDays.textContent = leftDays;

    // 阶段文案
    let label = labels.small;
    if (pct < 5)       label = labels.early;
    else if (pct < 50) label = labels.small;
    else if (pct < 90) label = labels.half;
    else               label = labels.near;
    $progressLabel.textContent = label;

    // 当前时间（让页面有"活着"的感觉）
    $live.textContent = `现在 ${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} 周${wk} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  }

  paintToday();
  paint();
  // 用 setInterval 1000ms，配合每秒重绘
  setInterval(paint, 1000);
})();
</script>
</body>
</html>
